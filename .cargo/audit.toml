# cargo-audit configuration.
#
# cargo-audit scans Cargo.lock, not the resolved build graph, so it reports
# advisories for crates that are present as lockfile entries but never compiled.

[advisories]
ignore = [
  # RUSTSEC-2023-0071 — Marvin timing sidechannel in `rsa`. No fixed version
  # exists upstream. `rsa` is pulled in only by `sqlx-mysql`; this workspace
  # enables sqlx's `postgres` feature only, so `rsa` is never built or linked.
  # `cargo tree -i rsa` resolves to nothing, and `cargo deny check advisories`
  # (which walks the build graph) does not flag it at all.
  # Revisit immediately if MySQL support is ever enabled.
  "RUSTSEC-2023-0071",
  # RUSTSEC-2026-0459 — CVE-2026-119375, bundled SQLite < 3.54.0 can return
  # uninitialized page-cache memory for a crafted db + `-wal` file pair. Fixed
  # in `libsqlite3-sys` 0.39, but every sqlx release (0.8.x and 0.9.0) caps it
  # at `< 0.38`, so no lockfile update can reach the fix. `libsqlite3-sys` is
  # pulled in only by `sqlx-sqlite`; this workspace enables sqlx's `postgres`
  # feature only, so it is never built or linked (`cargo tree -i
  # libsqlite3-sys --all-features` resolves to nothing). Revisit if SQLite
  # support is ever enabled, or once sqlx allows `libsqlite3-sys >= 0.39`.
  "RUSTSEC-2026-0459",
]
