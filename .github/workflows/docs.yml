name: Deploy Docs to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'assets/**'
      - 'scripts/check-docs-site.py'
      - '.github/workflows/docs.yml'
  # Pull requests build the site and check what it would publish; only a push
  # to main deploys.
  pull_request:
    branches: [main, dev]
    paths:
      - 'docs/**'
      - 'assets/**'
      - 'scripts/check-docs-site.py'
      - '.github/workflows/docs.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: ${{ github.event_name == 'pull_request' && format('docs-pr-{0}', github.event.pull_request.number) || 'pages' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # The docs are a pnpm project: install exactly what docs/pnpm-lock.yaml
      # records (the pnpm version comes from packageManager in package.json),
      # so every build uses the same dependency versions.
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: docs/package.json

      - uses: actions/setup-node@v5
        with:
          node-version: '22.x'
          cache: pnpm
          cache-dependency-path: docs/pnpm-lock.yaml

      - name: Install dependencies
        working-directory: docs
        run: pnpm install --frozen-lockfile

      - name: Build VitePress site
        working-directory: docs
        run: pnpm run build

      # Fails when the output holds anything outside the public allowlist,
      # mentions internal records, or contains credential-shaped text.
      - name: Check what the site publishes
        run: python3 scripts/check-docs-site.py

      - name: Upload artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/.vitepress/dist

  deploy:
    if: github.event_name != 'pull_request'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
