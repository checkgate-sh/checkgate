name: CI

on:
  push:
    branches:
      - main
      - dev
  pull_request:
    branches:
      - main
      - dev

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Least privilege: every job only reads the repository (artifact uploads use
# the runner's own token, not GITHUB_TOKEN).
permissions:
  contents: read

jobs:
  # ---------------------------------------------------------------------------
  # Repository hygiene — dependencies, build output and tool caches must not be
  # committed; every job below installs and builds what it needs itself.
  # ---------------------------------------------------------------------------
  hygiene:
    name: Repository hygiene
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: No generated or machine-specific files are tracked
        run: scripts/check-tracked-artifacts.sh

  # ---------------------------------------------------------------------------
  # Published benchmarks — schema, deterministic graphic, links, documented
  # commands. Runs no benchmark (those are manual: public-benchmarks.yml).
  # ---------------------------------------------------------------------------
  benchmarks:
    name: Benchmark results and graphic
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Scripts parse
        run: |
          bash -n bench/public/run.sh
          bash -n bench/public/compare.sh
          for f in bench/public/sdk/*.mjs; do node --check "$f"; done
          docker compose -f bench/public/compose.yml --profile tools config --quiet

      - name: Results, graphic, links and commands are consistent
        run: python3 bench/public/scripts/validate.py

  # ---------------------------------------------------------------------------
  # Rust — test the whole workspace
  # ---------------------------------------------------------------------------
  rust:
    name: Rust tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # rust-toolchain.toml pins the channel; this action honours it.
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

      - name: Test
        run: cargo test --workspace --all-features

      # Broken intra-doc links surface as warnings, so promote them to errors.
      - name: Docs
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --no-deps --all-features

  # ---------------------------------------------------------------------------
  # Benchmark harness smoke — every Criterion benchmark runs once (`--test`),
  # so a broken harness fails CI instead of silently dropping results from a
  # manual benchmark run. Measures nothing: timings on shared runners are not
  # comparable, and pass/fail here is about the harness only. Runs pinned to
  # 1, 2 and 4 CPUs because the concurrency group derives benchmark IDs from
  # the CPU count (a duplicate ID made Criterion panic on 4-vCPU runners).
  # ---------------------------------------------------------------------------
  bench-smoke:
    name: Benchmark harness (smoke)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2

      - name: Build the benchmarks
        run: cargo bench -p checkgate-bench --no-run

      - name: Run every benchmark once
        run: |
          set -euo pipefail
          for cpus in 0 0-1 0-3; do
            echo "== CPUs $cpus"
            taskset -c "$cpus" cargo bench -p checkgate-bench --bench evaluation -- --test
          done
          cargo bench -p checkgate-bench --bench snapshot_decode -- --test

  # ---------------------------------------------------------------------------
  # Supply chain — advisories, licenses, banned and duplicate crates.
  # `cargo deny` walks the resolved build graph; `cargo audit` reads Cargo.lock
  # and so also catches advisories on crates that are present but never built
  # (suppressions and their justification live in .cargo/audit.toml).
  # ---------------------------------------------------------------------------
  supply-chain:
    name: Supply chain
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: cargo-deny
        uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check

      - name: Install cargo-audit
        run: cargo install cargo-audit --locked

      - name: cargo-audit
        run: cargo audit

  # ---------------------------------------------------------------------------
  # Miri — undefined-behaviour checking for the FFI crates, which are the only
  # place this workspace writes `unsafe`. Everything else is #![forbid(unsafe_code)].
  # ---------------------------------------------------------------------------
  miri:
    name: Miri (FFI crates)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install nightly with Miri
        uses: dtolnay/rust-toolchain@nightly
        with:
          components: miri

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2

      - name: Run Miri
        run: |
          cargo +nightly miri test -p react-native
          cargo +nightly miri test -p flutter

  # ---------------------------------------------------------------------------
  # Server integration — spawn the real server binary against a real Postgres
  # and Redis and drive the HTTP API end to end (auth, RBAC, flags, segments,
  # analytics, A/B experiments, change-request approvals).
  # ---------------------------------------------------------------------------
  server-integration:
    name: Server integration tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      # Pinned by digest so a new upstream image cannot change test behaviour
      # under an unchanged commit (PostgreSQL 16.15, Redis 7.4.11).
      postgres:
        image: postgres:16@sha256:ca0bd484cb98bf4b24eb1010e73fb3fcbd6714d240fbc1a10eea5b7dbecb641d
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: checkgate_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7@sha256:4fa24486b8bcca8eec45ee0eb166edc674795e53a2b53d1a9ef263eecebaac85
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      CHECKGATE_TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/checkgate_test
      CHECKGATE_TEST_REDIS_URL: redis://localhost:6379
      # Assert the suites actually run here: if the two URLs above ever go
      # missing, the tests fail loudly instead of skipping and reporting ok.
      CHECKGATE_REQUIRE_INTEGRATION: "1"
      # Server logs of every multi-instance test and measured recovery windows.
      CHECKGATE_TEST_ARTIFACTS: ${{ github.workspace }}/reliability-artifacts
    steps:
      - uses: actions/checkout@v5

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2

      - name: Run server integration + SSE e2e tests
        run: |
          cargo test -p server --test integration -- --nocapture
          cargo test -p server --test e2e_sse -- --nocapture
          cargo test -p server --test rate_limit -- --nocapture
          cargo test -p server --test setup_ownership -- --nocapture
          cargo test -p server --test sdk_health -- --nocapture
          cargo test -p server --test environment_isolation -- --nocapture
          cargo test -p server --test hardening -- --nocapture
          cargo test -p server --test security_remediation -- --nocapture
          cargo test -p server --test integration_test_message -- --nocapture
          cargo test -p server --test analytics_hardening -- --nocapture
          cargo test -p server --test propose_scope -- --nocapture
          cargo test -p server --test governance -- --nocapture
          cargo test -p server --test harness -- --nocapture
          # Added in 0.2.0; they skip without PostgreSQL/Redis, so the Rust job
          # never ran them.
          cargo test -p server --test playground -- --nocapture
          cargo test -p server --test sdk_diagnostics -- --nocapture

      # The server's own tests that need PostgreSQL and Redis (they skip in
      # the Rust tests job, which has neither): the scheduler, analytics
      # retention against real tables, and the Redis-backed ingest quota.
      - name: Server unit tests against PostgreSQL and Redis
        run: cargo test -p server --bin server -- --nocapture

      # Health, readiness, graceful shutdown, metrics and admission control.
      - name: Lifecycle and metrics tests
        run: cargo test -p server --test lifecycle -- --nocapture

      # Multi-instance fault injection: several server processes against the
      # real PostgreSQL and Redis above, faults injected by in-process TCP
      # proxies. Each test has a bounded convergence deadline.
      - name: Multi-instance reliability tests
        run: cargo test -p server --test reliability -- --nocapture

      # SSE liveness, revoked keys, randomized faults (seeds 1-3) and the
      # segment-read-failure fault injection (server/tests/sse_faults.rs).
      - name: SSE fault-injection tests
        run: cargo test -p server --test sse_faults -- --nocapture

      # @checkgate/mcp-server against the real server binary built above: an
      # agent with a propose token proposes, the server queues it, a different
      # person approves, the agent reads it back. Also prints the measured
      # MCP-over-stdio overhead versus direct HTTP.
      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: MCP server end-to-end test
        working-directory: integrations/mcp-server
        env:
          PGPASSWORD: postgres
          CHECKGATE_E2E_SERVER_BIN: ${{ github.workspace }}/target/debug/server
          CHECKGATE_E2E_DATABASE_URL: postgres://postgres:postgres@localhost:5432/checkgate_mcp_e2e
          CHECKGATE_E2E_REDIS_URL: redis://localhost:6379
          CHECKGATE_REQUIRE_MCP_E2E: "1"
        run: |
          npm ci --ignore-scripts
          test -x "$CHECKGATE_E2E_SERVER_BIN" || cargo build -p server
          psql -h localhost -U postgres -c 'DROP DATABASE IF EXISTS checkgate_mcp_e2e' -c 'CREATE DATABASE checkgate_mcp_e2e'
          node --test test/e2e.test.js

      - name: Upload reliability artifacts
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: reliability-artifacts
          path: reliability-artifacts
          if-no-files-found: ignore
          retention-days: 14

  # ---------------------------------------------------------------------------
  # Native SDK e2e — build the real @checkgate/node addon and drive it over a
  # live SSE connection against a running server (the full application loop).
  # ---------------------------------------------------------------------------
  sdk-node-e2e:
    name: SDK e2e (live SSE)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: checkgate_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v5

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Build the server
        run: cargo build -p server

      - name: Build the Node SDK native addon
        working-directory: sdks/nodejs
        run: |
          npm install
          npm run build:debug

      - name: Native core attribute semantics
        working-directory: sdks/nodejs
        run: node --test test/native-attributes.test.js

      - name: Run native SDK e2e over live SSE
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/checkgate_test
          REDIS_URL: redis://localhost:6379
        run: |
          PORT=3111
          SETUP_TOKEN="ci-setup-token-$(openssl rand -hex 16)"
          SESSION_SECRET=ci-secret-0123456789-0123456789-0123456789-0123456789 \
            SETUP_TOKEN="$SETUP_TOKEN" \
            COOKIE_SECURE=false PORT=$PORT PUBLIC_DIR="$(mktemp -d)" RUST_LOG=warn \
            ./target/debug/server > server.log 2>&1 &
          SRV=$!
          for i in $(seq 1 60); do curl -sf "http://127.0.0.1:$PORT/health" >/dev/null && break; sleep 1; done
          CHECKGATE_URL="http://127.0.0.1:$PORT" CHECKGATE_SETUP_TOKEN="$SETUP_TOKEN" \
            node sdks/nodejs/e2e/e2e.cjs
          RC=$?
          kill $SRV 2>/dev/null || true
          if [ $RC -ne 0 ]; then echo "=== server log ==="; cat server.log; fi
          exit $RC

      # Every SDK's real client, transport and engine against a real server:
      # bootstrap, live updates, reconnect, half-open detection, poll
      # fallback, invalid and revoked keys, shutdown (sdks/conformance/live.mjs).
      - name: Toolchains for the web and Flutter engines
        run: |
          rustup target add wasm32-unknown-unknown
          npm install -g wasm-pack@0.15.1

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      # The Python SDK joins the live suite: scripts/sdk-live-e2e.sh expects
      # the package installed in sdks/python/.venv.
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Python SDK for the live suite
        run: |
          python -m venv sdks/python/.venv
          sdks/python/.venv/bin/pip install "maturin>=1.9.4,<2"
          sdks/python/.venv/bin/maturin build --release --manifest-path sdks/python/Cargo.toml --out dist-python
          sdks/python/.venv/bin/pip install dist-python/*.whl

      - name: Live end-to-end, every SDK
        env:
          PGPASSWORD: postgres
          REDIS_URL: redis://localhost:6379/5
        run: |
          psql -h localhost -U postgres -c 'CREATE DATABASE checkgate_live'
          DATABASE_URL=postgres://postgres:postgres@localhost:5432/checkgate_live \
            scripts/sdk-live-e2e.sh all

  # ---------------------------------------------------------------------------
  # Docker image — build it and smoke-test both deployment modes (all-in-one
  # and external PostgreSQL/Redis), restarts, persistence and refusal of
  # half-specified configuration.
  # ---------------------------------------------------------------------------
  docker-smoke:
    name: Docker image smoke tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: false
          load: true
          tags: checkgate:smoke
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke-test deployment modes
        run: scripts/docker-smoke.sh checkgate:smoke

  # ---------------------------------------------------------------------------
  # Dashboard — TypeScript build check
  # ---------------------------------------------------------------------------
  dashboard:
    name: Dashboard build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      - name: Install dependencies
        working-directory: dashboard
        run: bun install --frozen-lockfile

      - name: Type-check and build
        working-directory: dashboard
        run: bun run build

      - name: Run unit and integration tests
        working-directory: dashboard
        run: bun run test --run

  # ---------------------------------------------------------------------------
  # CLI — @checkgate/cli codegen tests (zero deps, Node's built-in test runner)
  # ---------------------------------------------------------------------------
  cli:
    name: CLI tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Run tests
        working-directory: cli
        run: node --test

      # Generated code is compiled, not just generated: rustc -D warnings,
      # tsc --strict and dart analyze --fatal-infos over every fixture.
      - uses: dtolnay/rust-toolchain@stable

      - uses: dart-lang/setup-dart@v1

      - name: Compile generated code (ts, dart, rust)
        working-directory: cli
        run: scripts/compile-generated.sh

      # The documented CI recipe, end to end: --check passes on fresh output and
      # fails with exit 3 and a JSON report once the output is stale.
      - name: --check round trip
        working-directory: cli
        run: |
          set -u
          out="$RUNNER_TEMP/checkgate-gen"
          node bin/checkgate.js typegen --lang ts,dart,rust --input test/fixtures/flags.json --out-dir "$out"
          node bin/checkgate.js typegen --lang ts,dart,rust --input test/fixtures/flags.json --out-dir "$out" --check
          echo '// stale' > "$out/flags.ts"
          set +e
          node bin/checkgate.js typegen --lang ts,dart,rust --input test/fixtures/flags.json --out-dir "$out" --check --json > "$RUNNER_TEMP/report.json"
          code=$?
          set -e
          test "$code" -eq 3
          node -e 'const r = JSON.parse(require("fs").readFileSync(process.argv[1], "utf8")); if (r.status !== "out_of_date" || r.findings[0].id !== "typegen.out_of_date") process.exit(1)' "$RUNNER_TEMP/report.json"

  # ---------------------------------------------------------------------------
  # MCP server — @checkgate/mcp-server unit, schema and stdio lifecycle tests
  # against a fake API (the e2e run against a real server is in
  # server-integration).
  # ---------------------------------------------------------------------------
  mcp-server:
    name: MCP server tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Install dependencies (lockfile, no install scripts)
        working-directory: integrations/mcp-server
        run: npm ci --ignore-scripts

      - name: Run tests
        working-directory: integrations/mcp-server
        run: npm test

      - name: Audit production dependencies
        working-directory: integrations/mcp-server
        run: npm audit --omit=dev --audit-level=high

  # ---------------------------------------------------------------------------
  # Edge — @checkgate/edge evaluator tests (zero deps, Node's built-in runner)
  # ---------------------------------------------------------------------------
  edge:
    name: Edge evaluator tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Run tests
        working-directory: edge
        run: node --test

  # ---------------------------------------------------------------------------
  # SSR — @checkgate/ssr bootstrap helpers (zero deps, Node's built-in runner)
  # ---------------------------------------------------------------------------
  ssr:
    name: SSR helpers tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Run tests
        working-directory: ssr
        run: node --test

  # ---------------------------------------------------------------------------
  # Node SDK — client-logic unit tests (the native core is mocked, so no native
  # build). The fault-injection suite uses the real `eventsource` transport,
  # the SDK's one runtime dependency.
  # ---------------------------------------------------------------------------
  sdk-node:
    name: Node SDK tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Install the runtime dependency
        working-directory: sdks/nodejs
        run: npm ci --omit=dev --ignore-scripts

      - name: Run tests
        working-directory: sdks/nodejs
        run: node --test

  # ---------------------------------------------------------------------------
  # Node SDK with the REAL native engine (sdk-node above uses the stand-in):
  # the shared evaluation vectors, and the OpenFeature provider against the
  # real OpenFeature SDK and a real SSE stream. Every Node.js line in LTS
  # (22 and 24 maintenance, 26 active); 20 reached end of life on 2026-04-30.
  # ---------------------------------------------------------------------------
  sdk-node-native:
    name: Node SDK (native) + OpenFeature provider (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24, 26]
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2

      - name: Build the native addon
        working-directory: sdks/nodejs
        run: npm ci && npm run build:debug

      - name: Node SDK tests (real engine, shared vectors)
        working-directory: sdks/nodejs
        run: node --test

      - name: OpenFeature provider — install, typecheck, test
        working-directory: sdks/openfeature-provider
        run: npm ci && npm run typecheck && npm test

  # ---------------------------------------------------------------------------
  # Node framework integrations — @checkgate/node-integrations (Express,
  # Fastify, NestJS) over the REAL @checkgate/node and its native addon, with
  # sdks/conformance/fault-server.mjs as the Checkgate server. Every Node.js
  # line in LTS (22 and 24 maintenance, 26 active); 20 reached end of life on
  # 2026-04-30.
  # ---------------------------------------------------------------------------
  node-integrations:
    name: Node integrations (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24, 26]
    steps:
      - uses: actions/checkout@v5

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2

      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}

      - name: Build the Node SDK native addon
        working-directory: sdks/nodejs
        run: |
          npm ci
          npm run build:debug

      - name: Install dependencies
        working-directory: sdks/node-integrations
        run: npm ci

      - name: Type definitions compile
        working-directory: sdks/node-integrations
        run: npm run typecheck

      - name: Run tests (adapters, examples, core)
        working-directory: sdks/node-integrations
        run: npm test

  # ---------------------------------------------------------------------------
  # Web + React Native SDKs — client-logic unit tests (vitest; the WASM core is
  # stubbed for web, the JSI bridge faked for RN — no native/WASM build needed)
  # ---------------------------------------------------------------------------
  sdk-web-rn:
    name: SDK tests (${{ matrix.sdk }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        sdk: [web, react-native]
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Install dependencies
        working-directory: sdks/${{ matrix.sdk }}
        run: npm install

      - name: Run tests
        working-directory: sdks/${{ matrix.sdk }}
        run: npx vitest run

  # ---------------------------------------------------------------------------
  # React Native SDK — the packed npm package must build its Rust engine on its
  # own and link into an Android libcheckgate.so with no undefined symbols
  # ---------------------------------------------------------------------------
  sdk-rn-android-native:
    name: SDK native (react-native, Android)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      # The package builds outside the repo (as it would from node_modules), so
      # it uses rustup's default toolchain rather than rust-toolchain.toml's.
      - name: Install Rust Android targets and cargo-ndk
        working-directory: /tmp
        run: |
          rustup target add aarch64-linux-android armv7-linux-androideabi i686-linux-android x86_64-linux-android
          cargo install cargo-ndk --locked

      - name: Pack, build, and link for every ABI
        working-directory: sdks/react-native
        env:
          ABIS: arm64-v8a armeabi-v7a x86 x86_64
        run: scripts/verify-android-native.sh

  # ---------------------------------------------------------------------------
  # Flutter SDK — Dart client-logic unit tests (native FFI is lazy-loaded and an
  # http.Client is injected, so no native library is needed), then the shared
  # SSE fault-injection suite against the real engine
  # ---------------------------------------------------------------------------
  sdk-flutter:
    name: Flutter SDK tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Install dependencies
        working-directory: sdks/flutter/dart
        run: flutter pub get

      - name: Run tests
        working-directory: sdks/flutter/dart
        run: flutter test

      # The shared SSE fault-injection suite (sdks/conformance), driving the
      # Dart client with the real Rust engine loaded from a host build.
      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2

      - name: Build the engine for the host
        run: cargo build -p flutter

      - name: SSE fault injection (CI seeds)
        env:
          CHECKGATE_FLUTTER_LIB: ${{ github.workspace }}/target/debug/libflutter.so
          CONFORMANCE_TRACE_DIR: ${{ github.workspace }}/conformance-traces
        run: node --test --test-concurrency=1 sdks/conformance/flutter.mjs

      - uses: actions/upload-artifact@v6
        if: failure()
        with:
          name: conformance-traces-flutter
          path: conformance-traces
          retention-days: 30

  sdk-python:
    name: Python SDK tests (${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The wheel is abi3 (CPython 3.11+): test the oldest and the newest.
        python: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      # Build the release wheel and test the installed wheel, not the source
      # tree: what users install is what is tested.
      - name: Build and install the wheel
        run: |
          python -m venv sdks/python/.venv
          sdks/python/.venv/bin/pip install "maturin>=1.9.4,<2" pytest
          sdks/python/.venv/bin/maturin build --release --manifest-path sdks/python/Cargo.toml --out dist-python
          sdks/python/.venv/bin/pip install dist-python/*.whl

      # Unit tests, the shared evaluation vectors, the sync state machine
      # against a local fake server, concurrency and fork safety.
      - name: Tests
        run: sdks/python/.venv/bin/python -m pytest sdks/python/tests -q

      # The shared SSE fault-injection suite (sdks/conformance), driving the
      # Python client with the real Rust engine.
      - name: SSE fault injection (CI seeds)
        env:
          PYTHON: ${{ github.workspace }}/sdks/python/.venv/bin/python
          CONFORMANCE_TRACE_DIR: ${{ github.workspace }}/conformance-traces
        run: node --test --test-concurrency=1 sdks/conformance/python.mjs

      - uses: actions/upload-artifact@v6
        if: failure()
        with:
          name: conformance-traces-python-${{ matrix.python }}
          path: conformance-traces
          retention-days: 30

  # ---------------------------------------------------------------------------
  # Go integrations — shared client, Terraform provider, Kubernetes operator
  # ---------------------------------------------------------------------------
  integrations:
    name: Go integrations
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        module:
          - integrations/checkgate-go
          - integrations/terraform-provider-checkgate
          - integrations/kubernetes-operator
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version: "1.26"
          cache-dependency-path: ${{ matrix.module }}/go.sum

      - name: Build
        working-directory: ${{ matrix.module }}
        run: go build ./...

      - name: Vet
        working-directory: ${{ matrix.module }}
        run: go vet ./...

      - name: Test
        working-directory: ${{ matrix.module }}
        run: go test ./...
