[package]
name = "react-native"
version.workspace = true
license.workspace = true
edition = "2021"

# The staticlib is what the app links: Gradle (cargo ndk) links it into
# libcheckgate.so on Android, and the CocoaPods build phase into the app on iOS.
[lib]
name = "checkgate_rn"
crate-type = ["cdylib", "staticlib"]

[dependencies]
checkgate-core = { version = "0.1.0", path = "../../core" }
serde_json = "1.0.149"

[lints]
workspace = true
