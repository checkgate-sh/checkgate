# cargo-deny configuration — advisories, licenses, and duplicate/banned crates.
# Run with: cargo deny check

[advisories]
yanked = "warn"
# NOTE on RUSTSEC-2023-0071 (Marvin timing sidechannel in `rsa`, no fix upstream):
# cargo-deny walks the *build graph* and never encounters `rsa` at all, so no
# ignore entry is needed here — adding one only produces an "advisory not
# encountered" warning. `rsa` reaches the lockfile solely through `sqlx-mysql`
# while this workspace enables sqlx's `postgres` feature only. `cargo audit`
# reads the lockfile instead of the build graph, so it *does* report it; that
# tool is silenced in `.cargo/audit.toml`. Revisit both if MySQL is ever added.
ignore = []

[licenses]
# Apache-2.0 project; these are the permissive licenses we accept in the tree.
allow = [
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "MIT",
  "MIT-0",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Unicode-3.0",
  "Zlib",
  "BSL-1.0",
  "CDLA-Permissive-2.0",
]
confidence-threshold = 0.8

[bans]
multiple-versions = "warn"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
