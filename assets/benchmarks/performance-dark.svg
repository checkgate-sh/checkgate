<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="1200" height="420" role="img" aria-labelledby="t d" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">
<title id="t">Checkgate v0.1.30 performance benchmarks</title>
<desc id="d">Evaluation latency: 295 ns (Rust core: 50% percentage rollout, 1,000-flag store, one thread; Node SDK isEnabled(), 5 attributes: 7.1 µs). Server throughput: 504 req/s (SDK snapshot reads, 10 concurrent clients, p99 35 ms; 1 vCPU · 512 MiB limit · 13 MiB peak RSS). Real-time propagation: 90 ms (p99 update → visible in SDK, 1,000 connected SDK clients; 600,000 deliveries · 0 missed). Measured 2026-11-11 on Intel(R) Core(TM) i5-8259U CPU @ 2.30GHz, 4 cores / 8 threads, 8 GiB, macOS 15.8.1; server limited to 1 vCPU, 512 MiB; commit b5d7556.</desc>
