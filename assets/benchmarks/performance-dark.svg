<text x="445" y="258" font-size="15" font-weight="400" fill="#c9d1d9" text-anchor="start">SDK snapshot reads, 10 concurrent</text>
<text x="445" y="280" font-size="15" font-weight="400" fill="#c9d1d9" text-anchor="start">clients, p99 35 ms</text>
