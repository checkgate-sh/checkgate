<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" width="1200" height="520" role="img" aria-labelledby="t d" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">
<title id="t">Checkgate v0.1.31: performance</title>
<desc id="d">SDK evaluation, median: 1.0 µs (Node SDK isEnabled(): 50% rollout, 1,000-flag store, no network call; batch means p95 1.0 µs · p99 1.1 µs · Rust core alone 303 ns; v0.1.30: 7.2 µs before · 7.15× faster). Server throughput, median of runs: 591 req/s (SDK snapshot reads, 1,000 concurrent clients, p99 2433 ms; one server limited to 1 vCPU · 512 MiB; v0.1.30: 489 req/s before · 1.21× more). CPU and memory, CPU time per request: 1.51 ms (server CPU per snapshot request (101 flags, 15 KB); peak RSS 59 MiB under that load; v0.1.30: 1.92 ms before · 21.2 % less CPU). Update propagation, p99 · pooled runs: 198 ms (p99 update → visible in SDK, 1,000 connected SDK clients; p50 39.2 ms · 0 of 1,200,000 missed · pooled over 6 runs; median run p99 84 ms; v0.1.30: 75 ms before · 2.63× worse). Measured 2026-11-18 on Intel(R) Core(TM) i5-8259U CPU @ 2.30GHz, 4 cores / 8 threads, 8 GiB, macOS 15.8.1; server limited to 1 vCPU, 512 MiB; commit 66cbfec. Measured under documented workloads and hardware. Results may vary by deployment.</desc>
