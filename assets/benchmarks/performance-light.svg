<text x="904" y="344" font-size="12.5" font-weight="400" fill="#59636e" text-anchor="start">p99 84 ms</text>
<line x1="40" y1="378" x2="1160" y2="378" stroke="#d8dee4"/>
<text x="40" y="404" font-size="13.5" font-weight="600" fill="#1f2328" text-anchor="start">Local evaluation</text>
<text x="40" y="424" font-size="12.5" font-weight="400" fill="#424a53" text-anchor="start">SDKs evaluate flags in-process: no request per flag decision.</text>
<text x="413" y="404" font-size="13.5" font-weight="600" fill="#1f2328" text-anchor="start">Server-sent events</text>
<text x="413" y="424" font-size="12.5" font-weight="400" fill="#424a53" text-anchor="start">One persistent connection per client carries flag changes.</text>
<text x="787" y="404" font-size="13.5" font-weight="600" fill="#1f2328" text-anchor="start">Rust server</text>
<text x="787" y="424" font-size="12.5" font-weight="400" fill="#424a53" text-anchor="start">Measured here inside a 1 vCPU / 512 MiB container.</text>
<line x1="40" y1="446" x2="1160" y2="446" stroke="#d8dee4"/>
<text x="40" y="472" font-size="12.5" font-weight="400" fill="#59636e" text-anchor="start">Intel Core i5-8259U · Docker Desktop 29.7.2, VM 8 vCPU / 3.8 GiB · server limited to 1 vCPU, 512 MiB · PostgreSQL 16 + Redis 7 in containers · 3 runs (propagation 6), commit 66cbfec.</text>
<text x="40" y="494" font-size="12.5" font-weight="400" fill="#59636e" text-anchor="start">Measured under documented workloads and hardware. Results may vary by deployment. Earlier version measured the same way, runs alternated (v0.1.30). Method and raw data: docs/performance/benchmarks.md</text>
</svg>
