<text x="1160" y="60" font-size="14" font-weight="400" fill="#59636e" text-anchor="end">v0.1.31 · measured 2026-11-18</text>
<text x="40" y="86" font-size="15" font-weight="400" fill="#424a53" text-anchor="start">Local evaluation. Real-time updates. Lightweight infrastructure.</text>
