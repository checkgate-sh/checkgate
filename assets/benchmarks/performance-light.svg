<text x="344" y="216" fill="#1f2328" font-weight="600"><tspan font-size="48">591</tspan><tspan font-size="20" fill="#424a53" dx="6">req/s</tspan></text>
<text x="344" y="244" font-size="13.5" font-weight="600" fill="#4f46e5" text-anchor="start">v0.1.30: 489 req/s before · 1.21× more</text>
<text x="344" y="268" font-size="13.5" font-weight="400" fill="#424a53" text-anchor="start">SDK snapshot reads, 1,000</text>
<text x="344" y="287" font-size="13.5" font-weight="400" fill="#424a53" text-anchor="start">concurrent clients, p99 2433 ms</text>
<text x="344" y="308" font-size="12.5" font-weight="400" fill="#59636e" text-anchor="start">one server limited to 1 vCPU ·</text>
<text x="344" y="326" font-size="12.5" font-weight="400" fill="#59636e" text-anchor="start">512 MiB</text>
