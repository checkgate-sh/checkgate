<text x="40" y="216" fill="#1f2328" font-weight="600"><tspan font-size="48">1.0</tspan><tspan font-size="20" fill="#424a53" dx="6">µs</tspan></text>
<text x="40" y="244" font-size="13.5" font-weight="600" fill="#4f46e5" text-anchor="start">v0.1.30: 7.2 µs before · 7.15× faster</text>
<text x="40" y="268" font-size="13.5" font-weight="400" fill="#424a53" text-anchor="start">Node SDK isEnabled(): 50% rollout,</text>
<text x="40" y="287" font-size="13.5" font-weight="400" fill="#424a53" text-anchor="start">1,000-flag store, no network call</text>
<text x="40" y="308" font-size="12.5" font-weight="400" fill="#59636e" text-anchor="start">batch means p95 1.0 µs · p99 1.1 µs ·</text>
<text x="40" y="326" font-size="12.5" font-weight="400" fill="#59636e" text-anchor="start">Rust core alone 303 ns</text>
<line x1="320" y1="124" x2="320" y2="358" stroke="#d8dee4"/>
<rect x="344" y="128" width="28" height="4" rx="2" fill="#4f46e5"/>
