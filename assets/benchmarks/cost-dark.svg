<text x="560" y="258" font-size="13" font-weight="400" fill="#f0f6fc" text-anchor="start">669 GB</text>
<text x="740" y="258" font-size="13" font-weight="400" fill="#f0f6fc" text-anchor="start">30 s</text>
<text x="440" y="286" font-size="14" font-weight="600" fill="#f0f6fc" text-anchor="start">Poll 30 s</text>
<rect x="532" y="274" width="40" height="14" rx="3" fill="#3b3f73"/>
<text x="580" y="286" font-size="13" font-weight="400" fill="#f0f6fc" text-anchor="start">1,340 GB</text>
<text x="740" y="286" font-size="13" font-weight="400" fill="#f0f6fc" text-anchor="start">15 s</text>
<text x="440" y="314" font-size="14" font-weight="600" fill="#f0f6fc" text-anchor="start">Poll 10 s</text>
<rect x="532" y="302" width="120" height="14" rx="3" fill="#3b3f73"/>
<text x="660" y="314" font-size="13" font-weight="400" fill="#f0f6fc" text-anchor="start">4,020 GB</text>
<text x="740" y="314" font-size="13" font-weight="400" fill="#f0f6fc" text-anchor="start">5 s</text>
<text x="440" y="344" font-size="11.5" font-weight="400" fill="#9198a1" text-anchor="start">Assumes 100 flag changes/day, 4 reconnects/client/day.</text>
<text x="440" y="362" font-size="11.5" font-weight="400" fill="#9198a1" text-anchor="start">Each poll returns the whole flag set (no conditional requests).</text>
<line x1="840" y1="124" x2="840" y2="420" stroke="#30363d"/>
<rect x="860" y="124" width="28" height="4" rx="2" fill="#818cf8"/>
<text x="860" y="154" font-size="15" font-weight="600" fill="#c9d1d9" text-anchor="start">Projected monthly cost</text>
<text x="860" y="174" font-size="12" font-weight="400" fill="#9198a1" text-anchor="start">AWS us-east-1 on-demand list prices</text>
<text x="860" y="210" font-size="14" font-weight="400" fill="#c9d1d9" text-anchor="start">Streaming, 100–10,000 clients</text>
<text x="1160" y="210" font-size="18" font-weight="600" fill="#f0f6fc" text-anchor="end">$38.56</text>
<text x="860" y="232" font-size="11.5" font-weight="400" fill="#9198a1" text-anchor="start">same infrastructure; not deployed on AWS</text>
<text x="860" y="258" font-size="12" font-weight="400" fill="#9198a1" text-anchor="start">1,000 clients, polling instead:</text>
<text x="860" y="280" font-size="14" font-weight="400" fill="#c9d1d9" text-anchor="start">every 60 s</text>
<text x="1160" y="280" font-size="16" font-weight="600" fill="#f0f6fc" text-anchor="end">$89.80</text>
<text x="860" y="304" font-size="14" font-weight="400" fill="#c9d1d9" text-anchor="start">every 30 s</text>
<text x="1160" y="304" font-size="16" font-weight="600" fill="#f0f6fc" text-anchor="end">$150.08</text>
<text x="860" y="328" font-size="14" font-weight="400" fill="#c9d1d9" text-anchor="start">every 10 s</text>
<text x="1160" y="328" font-size="16" font-weight="600" fill="#f0f6fc" text-anchor="end">$390.94</text>
<text x="860" y="358" font-size="12" font-weight="400" fill="#9198a1" text-anchor="start">1 server + PostgreSQL + Redis + storage</text>
<text x="860" y="376" font-size="12" font-weight="400" fill="#9198a1" text-anchor="start">+ egress. A projection, not a quote.</text>
<line x1="40" y1="440" x2="1160" y2="440" stroke="#30363d"/>
<text x="40" y="466" font-size="12" font-weight="400" fill="#9198a1" text-anchor="start">Measured: CPU, memory, bytes and freshness of one server at 1 vCPU / 512 MiB, with PostgreSQL and Redis in containers.</text>
<text x="40" y="486" font-size="12" font-weight="400" fill="#9198a1" text-anchor="start">Calculated: monthly traffic from measured bytes per heartbeat, change and reconnect at the stated rates. Projected: priced with</text>
<text x="40" y="506" font-size="12" font-weight="400" fill="#9198a1" text-anchor="start">dated third-party list prices. Polling is Checkgate's own snapshot endpoint on the same infrastructure, not another product.</text>
<text x="40" y="526" font-size="12" font-weight="400" fill="#9198a1" text-anchor="start">Measured under documented workloads and hardware. Results may vary by deployment.</text>
<text x="40" y="554" font-size="12" font-weight="400" fill="#9198a1" text-anchor="start">Method, assumptions, prices and raw data: docs/performance/cost-efficiency.md</text>
</svg>
