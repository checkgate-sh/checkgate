<text x="240" y="254" font-size="14" font-weight="400" fill="#f0f6fc" text-anchor="start">47 MiB</text>
<text x="310" y="254" font-size="14" font-weight="400" fill="#f0f6fc" text-anchor="start">6.48 KB/h</text>
<text x="40" y="280" font-size="14" font-weight="600" fill="#f0f6fc" text-anchor="start">5,000</text>
<text x="160" y="280" font-size="14" font-weight="400" fill="#f0f6fc" text-anchor="start">6.89 %</text>
<text x="240" y="280" font-size="14" font-weight="400" fill="#f0f6fc" text-anchor="start">206 MiB</text>
<text x="310" y="280" font-size="14" font-weight="400" fill="#f0f6fc" text-anchor="start">6.48 KB/h</text>
<text x="40" y="306" font-size="14" font-weight="600" fill="#f0f6fc" text-anchor="start">10,000</text>
<text x="160" y="306" font-size="14" font-weight="400" fill="#f0f6fc" text-anchor="start">14.7 %</text>
