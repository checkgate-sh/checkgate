<text x="160" y="228" font-size="14" font-weight="400" fill="#f0f6fc" text-anchor="start">0.15 %</text>
<text x="240" y="228" font-size="14" font-weight="400" fill="#f0f6fc" text-anchor="start">16 MiB</text>
<text x="310" y="228" font-size="14" font-weight="400" fill="#f0f6fc" text-anchor="start">6.48 KB/h</text>
