<text x="436" y="344" font-size="11.5" font-weight="400" fill="#8691b4" text-anchor="start">Assumes 100 flag changes/day, 4 reconnects/client/day.</text>
<text x="436" y="362" font-size="11.5" font-weight="400" fill="#8691b4" text-anchor="start">Polls return the whole flag set; no conditional requests.</text>
<rect x="840" y="132" width="24" height="4" rx="2" fill="#818cf8"/>
<text x="840" y="160" font-size="15" font-weight="600" fill="#e8edff" text-anchor="start">Projected monthly cost</text>
<text x="840" y="180" font-size="12" font-weight="400" fill="#8691b4" text-anchor="start">AWS us-east-1 on-demand list prices</text>
<text x="840" y="210" font-size="14" font-weight="400" fill="#b4bedb" text-anchor="start">Streaming, 100–10,000 clients</text>
<text x="1140" y="210" font-size="18" font-weight="600" fill="#e8edff" text-anchor="end">$38.56</text>
<text x="840" y="232" font-size="11.5" font-weight="400" fill="#8691b4" text-anchor="start">same infrastructure; not deployed on AWS</text>
<text x="840" y="258" font-size="12" font-weight="400" fill="#8691b4" text-anchor="start">1,000 clients, polling instead:</text>
<text x="840" y="280" font-size="14" font-weight="400" fill="#b4bedb" text-anchor="start">every 60 s</text>
<text x="1140" y="280" font-size="16" font-weight="600" fill="#e8edff" text-anchor="end">$89.80</text>
<text x="840" y="304" font-size="14" font-weight="400" fill="#b4bedb" text-anchor="start">every 30 s</text>
<text x="1140" y="304" font-size="16" font-weight="600" fill="#e8edff" text-anchor="end">$150.08</text>
<text x="840" y="328" font-size="14" font-weight="400" fill="#b4bedb" text-anchor="start">every 10 s</text>
<text x="1140" y="328" font-size="16" font-weight="600" fill="#e8edff" text-anchor="end">$390.94</text>
<text x="840" y="358" font-size="12" font-weight="400" fill="#8691b4" text-anchor="start">1 server + PostgreSQL + Redis + storage</text>
<text x="840" y="376" font-size="12" font-weight="400" fill="#8691b4" text-anchor="start">+ egress. A projection, not a quote.</text>
<text x="40" y="466" font-size="12" font-weight="400" fill="#8691b4" text-anchor="start">Measured: CPU, memory, bytes and freshness of one server at 1 vCPU / 512 MiB, with PostgreSQL and Redis in containers.</text>
<text x="40" y="486" font-size="12" font-weight="400" fill="#8691b4" text-anchor="start">Calculated: monthly traffic from measured bytes per heartbeat, change and reconnect at the stated rates. Projected: priced with</text>
<text x="40" y="506" font-size="12" font-weight="400" fill="#8691b4" text-anchor="start">dated third-party list prices. Polling is Checkgate's own snapshot endpoint on the same infrastructure, not another product.</text>
<text x="40" y="526" font-size="12" font-weight="400" fill="#8691b4" text-anchor="start">Measured under documented workloads and hardware. Results may vary by deployment.</text>
<text x="40" y="554" font-size="12" font-weight="400" fill="#8691b4" text-anchor="start">Method, assumptions, prices and raw data: docs/performance/cost-efficiency.md</text>
</svg>
