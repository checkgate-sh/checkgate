<text x="440" y="154" font-size="15" font-weight="600" fill="#c9d1d9" text-anchor="start">1,000 clients: streaming vs polling</text>
<text x="440" y="174" font-size="12" font-weight="400" fill="#9198a1" text-anchor="start">traffic per month (calculated) · freshness (measured)</text>
<text x="440" y="204" font-size="12" font-weight="600" fill="#9198a1" text-anchor="start"></text>
<text x="532" y="204" font-size="12" font-weight="600" fill="#9198a1" text-anchor="start">Traffic / month</text>
