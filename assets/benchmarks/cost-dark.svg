<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 574" width="1200" height="574" role="img" aria-labelledby="t d" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">
<title id="t">Checkgate v0.1.31: infrastructure cost and savings</title>
<desc id="d">100 streaming clients: 0.15 % of one CPU idle, 16 MiB RSS, 6.48 KB of heartbeats per client per hour; 1,000 streaming clients: 1.5 % of one CPU idle, 47 MiB RSS, 6.48 KB of heartbeats per client per hour; 5,000 streaming clients: 6.89 % of one CPU idle, 206 MiB RSS, 6.48 KB of heartbeats per client per hour; 10,000 streaming clients: 14.7 % of one CPU idle, 448 MiB RSS, 6.48 KB of heartbeats per client per hour; SSE at 1,000 clients: 8.69 GB a month, 121,680 requests a month, freshness p50 33 ms; Poll 60 s at 1,000 clients: 669 GB a month, 43,804,800 requests a month, freshness p50 30 s; Poll 30 s at 1,000 clients: 1,340 GB a month, 87,609,600 requests a month, freshness p50 15 s; Poll 10 s at 1,000 clients: 4,020 GB a month, 262,828,800 requests a month, freshness p50 5 s; projected $38.56 a month for 100–10,000 clients streaming; projected $89.80 a month for 1,000 clients polling every 60 s; projected $150.08 a month for 1,000 clients polling every 30 s; projected $390.94 a month for 1,000 clients polling every 10 s. Prices accessed 2026-11-19, AWS us-east-1 (N. Virginia), on-demand, Linux, single-AZ. Measured under documented workloads and hardware. Results may vary by deployment.</desc>
<rect x="0.5" y="0.5" width="1199" height="573" rx="16" fill="#0d1117" stroke="#30363d"/>
<text x="40" y="60" font-size="24" font-weight="600" fill="#f0f6fc" text-anchor="start">Infrastructure Cost &amp; Savings</text>
<text x="1160" y="60" font-size="14" font-weight="400" fill="#9198a1" text-anchor="end">v0.1.31 · prices accessed 2026-11-19</text>
<text x="40" y="86" font-size="15" font-weight="400" fill="#c9d1d9" text-anchor="start">Understand the infrastructure required to run your own feature flags.</text>
