<text x="542" y="230" font-size="13" font-weight="400" fill="#f0f6fc" text-anchor="start">8.69 GB</text>
<text x="740" y="230" font-size="13" font-weight="400" fill="#f0f6fc" text-anchor="start">33 ms</text>
