<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 380" width="820" height="380" role="img" aria-label="A flag change flows from the dashboard to the Checkgate server, which pushes it over SSE to every SDK, where flags evaluate locally in-process.">
<style>
  .wire { fill:none; stroke:#30363d; stroke-width:2; stroke-dasharray:5 6; }
  .node rect { fill:#161b22; stroke:#30363d; stroke-width:1.5; }
  .server > rect { stroke:#818cf8; }
  .pill { fill:#0d1117; stroke:#30363d; stroke-width:1; }
  .pill-accent { fill:#1e1b4b; stroke:#4f46e5; stroke-width:1; }
  .title { fill:#e6edf3; font:700 14px system-ui,-apple-system,'Segoe UI',Roboto,sans-serif; text-anchor:middle; }
  .sub { fill:#8b949e; font:11px system-ui,-apple-system,'Segoe UI',Roboto,sans-serif; text-anchor:middle; }
  .pill-text { fill:#e6edf3; font:600 11px system-ui,-apple-system,'Segoe UI',Roboto,sans-serif; text-anchor:middle; }
  .edge { fill:#6e7681; font:600 11px ui-monospace,SFMono-Regular,'SF Mono',Menlo,monospace; text-anchor:middle; }
  /* Right-anchored: centred on the client column this label overflows the viewBox. */
  .edge-end { fill:#6e7681; font:600 11px ui-monospace,SFMono-Regular,'SF Mono',Menlo,monospace; text-anchor:end; }
  .write { fill:#3b82f6; }
  .push { fill:#818cf8; }
  .flash { fill:#818cf8; opacity:0; animation:arrive 3.2s linear infinite; }
  @keyframes arrive { 0%,70% { opacity:0; } 74% { opacity:.22; } 82%,100% { opacity:0; } }
  /* Honour a reduced-motion preference: keep the diagram, drop the movement. */
  @media (prefers-reduced-motion: reduce) {
    .packet { display:none; }
    .flash { animation:none; }
  }
</style>
<path class="wire" d="M172,190 L300,190"/>
<path class="wire" d="M500,190 Q590,60 654,60"/>
<path class="wire" d="M500,190 Q590,140 654,140"/>
<path class="wire" d="M500,190 Q590,220 654,220"/>
<path class="wire" d="M500,190 Q590,300 654,300"/>
<g class="node"><rect x="20" y="150" width="152" height="80" rx="14"/><text x="96" y="184" class="title">Dashboard / API</text><text x="96" y="205" class="sub">toggle a flag</text></g>
<g class="node server"><rect x="300" y="104" width="200" height="172" rx="16"/><text x="400" y="130" class="title">Checkgate Server</text><rect x="318" y="146" width="164" height="30" rx="8" class="pill-accent"/><text x="400" y="166" class="pill-text">in-memory FlagStore</text><rect x="318" y="186" width="78" height="28" rx="8" class="pill"/><text x="357" y="205" class="pill-text">PostgreSQL</text><rect x="404" y="186" width="78" height="28" rx="8" class="pill"/><text x="443" y="205" class="pill-text">Redis</text><text x="400" y="248" class="sub">pushes deltas over SSE</text></g>
<text x="578" y="24" class="edge">SSE &#183; &lt;50 ms</text>
<g class="node"><rect x="654" y="33" width="146" height="54" rx="12"/><rect class="flash" x="654" y="33" width="146" height="54" rx="12"/><text x="727" y="57" class="title">Node.js</text><text x="727" y="75" class="sub">NAPI &#183; local eval</text></g>
<g class="node"><rect x="654" y="113" width="146" height="54" rx="12"/><rect class="flash" x="654" y="113" width="146" height="54" rx="12"/><text x="727" y="137" class="title">Web</text><text x="727" y="155" class="sub">WASM &#183; local eval</text></g>
<g class="node"><rect x="654" y="193" width="146" height="54" rx="12"/><rect class="flash" x="654" y="193" width="146" height="54" rx="12"/><text x="727" y="217" class="title">React Native</text><text x="727" y="235" class="sub">JSI &#183; local eval</text></g>
<g class="node"><rect x="654" y="273" width="146" height="54" rx="12"/><rect class="flash" x="654" y="273" width="146" height="54" rx="12"/><text x="727" y="297" class="title">Flutter</text><text x="727" y="315" class="sub">FFI &#183; local eval</text></g>
<text x="800" y="352" class="edge-end">isEnabled() &#183; ~100 ns, in-process</text>
<circle class="packet write" r="5"><animateMotion dur="3.2s" repeatCount="indefinite" keyTimes="0;0.35;1" keyPoints="0;1;1" calcMode="linear" path="M172,190 L300,190"/><animate attributeName="opacity" dur="3.2s" repeatCount="indefinite" keyTimes="0;0.02;0.33;0.36;1" values="0;1;1;0;0"/></circle>
<circle class="packet push" r="5"><animateMotion dur="3.2s" repeatCount="indefinite" keyTimes="0;0.4;0.75;1" keyPoints="0;0;1;1" calcMode="linear" path="M500,190 Q590,60 654,60"/><animate attributeName="opacity" dur="3.2s" repeatCount="indefinite" keyTimes="0;0.4;0.42;0.73;0.76;1" values="0;0;1;1;0;0"/></circle>
<circle class="packet push" r="5"><animateMotion dur="3.2s" repeatCount="indefinite" keyTimes="0;0.4;0.75;1" keyPoints="0;0;1;1" calcMode="linear" path="M500,190 Q590,140 654,140"/><animate attributeName="opacity" dur="3.2s" repeatCount="indefinite" keyTimes="0;0.4;0.42;0.73;0.76;1" values="0;0;1;1;0;0"/></circle>
<circle class="packet push" r="5"><animateMotion dur="3.2s" repeatCount="indefinite" keyTimes="0;0.4;0.75;1" keyPoints="0;0;1;1" calcMode="linear" path="M500,190 Q590,220 654,220"/><animate attributeName="opacity" dur="3.2s" repeatCount="indefinite" keyTimes="0;0.4;0.42;0.73;0.76;1" values="0;0;1;1;0;0"/></circle>
<circle class="packet push" r="5"><animateMotion dur="3.2s" repeatCount="indefinite" keyTimes="0;0.4;0.75;1" keyPoints="0;0;1;1" calcMode="linear" path="M500,190 Q590,300 654,300"/><animate attributeName="opacity" dur="3.2s" repeatCount="indefinite" keyTimes="0;0.4;0.42;0.73;0.76;1" values="0;0;1;1;0;0"/></circle>
</svg>
