<text x="62" y="236" font-size="14" font-weight="400" fill="#3A4466" text-anchor="start">rollout. Automation</text>
<text x="62" y="258" font-size="14" font-weight="400" fill="#3A4466" text-anchor="start">uses tokens: Terraform,</text>
<text x="62" y="280" font-size="14" font-weight="400" fill="#3A4466" text-anchor="start">operator, MCP agents.</text>
<circle cx="64" cy="312" r="13" fill="#4F46E5"/><text x="64" y="317" font-size="14" font-weight="700" fill="#FFFFFF" text-anchor="middle">1</text>
<text x="86" y="317" font-size="13" font-weight="600" fill="#5D6787" text-anchor="start">a flag changes</text>
<rect x="300" y="120" width="320" height="246" rx="16" fill="#F6F7FC" stroke="#4F46E5" stroke-width="1.5"/>
<text x="324" y="156" font-size="17" font-weight="700" fill="#0F1428" text-anchor="start">Checkgate server</text>
<text x="324" y="178" font-size="13" font-weight="400" fill="#5D6787" text-anchor="start">Rust · self-hosted</text>
<rect x="320" y="196" width="280" height="40" rx="10" fill="#EEF0FA" stroke="#DDE1EE" stroke-width="1.5"/>
<text x="336" y="221" font-size="14" font-weight="700" fill="#0F1428" text-anchor="start">PostgreSQL</text>
<text x="430" y="221" font-size="13" font-weight="400" fill="#3A4466" text-anchor="start">flags, revisions, audit</text>
<rect x="320" y="246" width="280" height="40" rx="10" fill="#EEF0FA" stroke="#DDE1EE" stroke-width="1.5"/>
<text x="336" y="271" font-size="14" font-weight="700" fill="#0F1428" text-anchor="start">Redis</text>
<text x="430" y="271" font-size="13" font-weight="400" fill="#3A4466" text-anchor="start">fan-out across instances</text>
<rect x="320" y="296" width="280" height="40" rx="10" fill="#EEF0FA" stroke="#DDE1EE" stroke-width="1.5"/>
<text x="336" y="321" font-size="14" font-weight="700" fill="#4F46E5" text-anchor="start">SSE</text>
<text x="430" y="321" font-size="13" font-weight="400" fill="#3A4466" text-anchor="start">one stream per SDK</text>
<circle cx="324" cy="352" r="13" fill="#4F46E5"/><text x="324" y="357" font-size="14" font-weight="700" fill="#FFFFFF" text-anchor="middle">2</text>
<text x="346" y="357" font-size="13" font-weight="600" fill="#5D6787" text-anchor="start">commit, then push</text>
