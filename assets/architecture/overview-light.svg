<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" width="1200" height="600" role="img" aria-labelledby="t d" font-family="Inter, system-ui, -apple-system, &apos;Segoe UI&apos;, Roboto, Helvetica, Arial, sans-serif">
<title id="t">How Checkgate works: configuration syncs to SDKs; flags evaluate inside your process</title>
<desc id="d">1. A flag changes in the dashboard or through the API. 2. The Checkgate server commits it to PostgreSQL, fans it out to every server instance through Redis, and pushes it over a Server-Sent Events stream to each connected SDK; SDKs reconnect with backoff and poll the snapshot endpoint if a stream cannot be established. 3. The SDK keeps the flags in a local store inside your process. 4. Your code calls isEnabled(), which the SDK's Rust engine answers from that store with no network request. The server never evaluates your application's flag checks; SDKs that report impressions send them in background batches.</desc>
<defs>
<marker id="a-sync" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#4F46E5"/></marker>
<marker id="a-eval" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#7C3AED"/></marker>
<marker id="a-muted" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#5D6787"/></marker>
</defs>
