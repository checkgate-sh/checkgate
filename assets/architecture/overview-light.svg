<text x="40" y="86" font-size="15" font-weight="400" fill="#3A4466" text-anchor="start">Configuration syncs in the background. Flag checks are answered inside your process.</text>
<rect x="40" y="150" width="214" height="186" rx="16" fill="#F6F7FC" stroke="#DDE1EE" stroke-width="1.5"/>
