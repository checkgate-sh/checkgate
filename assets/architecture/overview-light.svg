<text x="804" y="142" font-size="15" font-weight="600" fill="#5D6787" text-anchor="start">Your service — one process</text>
<rect x="800" y="160" width="340" height="168" rx="16" fill="#F6F7FC" stroke="#7C3AED" stroke-width="1.5"/>
<text x="822" y="194" font-size="17" font-weight="700" fill="#0F1428" text-anchor="start">Checkgate SDK</text>
