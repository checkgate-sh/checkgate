<text x="836" y="240" font-size="14" font-weight="700" fill="#0F1428" text-anchor="start">Local flag store</text>
<text x="836" y="262" font-size="12.5" font-weight="400" fill="#3A4466" text-anchor="start">last known flags;</text>
<text x="836" y="279" font-size="12.5" font-weight="400" fill="#3A4466" text-anchor="start">kept if the stream</text>
<text x="836" y="296" font-size="12.5" font-weight="400" fill="#3A4466" text-anchor="start">drops</text>
<rect x="1000" y="210" width="120" height="96" rx="10" fill="#EEF0FA" stroke="#DDE1EE" stroke-width="1.5"/>
<text x="1014" y="240" font-size="14" font-weight="700" fill="#0F1428" text-anchor="start">Rust engine</text>
<text x="1014" y="262" font-size="12.5" font-weight="400" fill="#3A4466" text-anchor="start">same code in</text>
<text x="1014" y="279" font-size="12.5" font-weight="400" fill="#3A4466" text-anchor="start">every SDK</text>
<path d="M984 258 H997" stroke="#5D6787" stroke-width="2" marker-end="url(#a-muted)"/>
<rect x="800" y="392" width="340" height="96" rx="16" fill="#EEF0FA" stroke="#DDE1EE" stroke-width="1.5"/>
<text x="822" y="424" font-size="15" font-weight="700" fill="#0F1428" text-anchor="start">Your code</text>
<text x="822" y="452" font-size="14" font-weight="600" fill="#7C3AED" text-anchor="start" font-family="ui-monospace, SFMono-Regular, &apos;SF Mono&apos;, Menlo, Consolas, &apos;Liberation Mono&apos;, monospace">isEnabled('new-checkout', user)</text>
<text x="822" y="474" font-size="13" font-weight="400" fill="#3A4466" text-anchor="start">answered in-process · no network request</text>
<path d="M1046 392 V312" stroke="#7C3AED" stroke-width="2.5" marker-end="url(#a-eval)"/>
<path d="M1076 312 V392" stroke="#7C3AED" stroke-width="2.5" marker-end="url(#a-eval)"/>
<circle cx="1018" cy="352" r="13" fill="#7C3AED"/><text x="1018" y="357" font-size="14" font-weight="700" fill="#FFFFFF" text-anchor="middle">4</text>
<text x="996" y="357" font-size="13" font-weight="600" fill="#5D6787" text-anchor="end">every check</text>
<path d="M254 243 H296" stroke="#4F46E5" stroke-width="2.5" marker-end="url(#a-sync)"/>
<path d="M620 262 C690 262 740 236 796 236" fill="none" stroke="#4F46E5" stroke-width="2.5" marker-end="url(#a-sync)"/>
<circle cx="642" cy="206" r="13" fill="#4F46E5"/><text x="642" y="211" font-size="14" font-weight="700" fill="#FFFFFF" text-anchor="middle">3</text>
<text x="662" y="211" font-size="13" font-weight="700" fill="#4F46E5" text-anchor="start">push over SSE</text>
<text x="632" y="282" font-size="12" font-weight="400" fill="#5D6787" text-anchor="start">heartbeats ·</text>
<text x="632" y="298" font-size="12" font-weight="400" fill="#5D6787" text-anchor="start">reconnect with backoff</text>
<path d="M796 316 C730 316 680 340 624 340" fill="none" stroke="#5D6787" stroke-width="1.75" stroke-dasharray="5 6" marker-end="url(#a-muted)"/>
<text x="632" y="370" font-size="12" font-weight="400" fill="#5D6787" text-anchor="start">polls the snapshot only</text>
<text x="632" y="386" font-size="12" font-weight="400" fill="#5D6787" text-anchor="start">if a stream cannot be</text>
<text x="632" y="402" font-size="12" font-weight="400" fill="#5D6787" text-anchor="start">established</text>
<line x1="40" y1="530" x2="1160" y2="530" stroke="#DDE1EE"/>
<path d="M40 543 H76" stroke="#4F46E5" stroke-width="3" marker-end="url(#a-sync)"/>
<text x="88" y="548" font-size="14" font-weight="600" fill="#3A4466" text-anchor="start">Sync path — runs when configuration changes</text>
<path d="M520 543 H556" stroke="#7C3AED" stroke-width="3" marker-end="url(#a-eval)"/>
<text x="568" y="548" font-size="14" font-weight="600" fill="#3A4466" text-anchor="start">Evaluation path — every flag check, inside your process</text>
<text x="40" y="576" font-size="12.5" font-weight="400" fill="#5D6787" text-anchor="start">No request per flag check; impressions, when enabled, are batched in the background. A dropped stream keeps the last known flags.</text>
