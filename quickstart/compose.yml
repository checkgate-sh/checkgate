# Checkgate quickstart: the all-in-one image (PostgreSQL, Redis, the server
# and the dashboard in one container) for local development only.
#   ./quickstart/start.sh          # writes .env, starts, waits until ready
# CHECKGATE_IMAGE=checkgate:latest uses an image built from this checkout
# (`docker compose build` at the repository root) instead of the published one.
services:
  checkgate:
    image: ${CHECKGATE_IMAGE:-ghcr.io/checkgate-sh/checkgate:latest}
    # Loopback only by default: this is a development instance on plain HTTP
    # with COOKIE_SECURE=false. CHECKGATE_BIND=0.0.0.0 exposes it to your
    # network (and on Linux, Docker's port rules bypass ufw/firewalld).
    ports:
      - "${CHECKGATE_BIND:-127.0.0.1}:${CHECKGATE_PORT:-3000}:3000"
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?run quickstart/start.sh to create .env}
      SESSION_SECRET: ${SESSION_SECRET:?run quickstart/start.sh to create .env}
      SETUP_TOKEN: ${SETUP_TOKEN:?run quickstart/start.sh to create .env}
      COOKIE_SECURE: "false"
    volumes:
      - quickstart_pgdata:/var/lib/postgresql/data
      - quickstart_redis:/var/lib/redis
    stop_grace_period: 30s

volumes:
  quickstart_pgdata:
  quickstart_redis:
